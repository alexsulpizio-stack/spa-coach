name: Build and publish Spa Coach APK

on:
  push:
    branches: [main]
    paths: [spa-coach-android-source.zip]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spa-coach-android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "platform-tools"

      - name: Extract source
        run: unzip -q spa-coach-android-source.zip -d source

      - name: Restore signing key
        shell: bash
        run: echo "$SPA_COACH_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/spa-coach.keystore"
        env:
          SPA_COACH_KEYSTORE_B64: ${{ secrets.SPA_COACH_KEYSTORE_B64 }}

      - name: Build signed APK
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
        env:
          SPA_COACH_KEYSTORE: ${{ runner.temp }}/spa-coach.keystore
          SPA_COACH_STORE_PASSWORD: ${{ secrets.SPA_COACH_STORE_PASSWORD }}
          SPA_COACH_KEY_ALIAS: ${{ secrets.SPA_COACH_KEY_ALIAS }}
          SPA_COACH_KEY_PASSWORD: ${{ secrets.SPA_COACH_KEY_PASSWORD }}

      - name: Read version and prepare release
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName = '\([^']*\)'.*/\1/p" source/android/app/build.gradle)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' source/android/app/build.gradle)
          test -n "$VERSION" && test -n "$CODE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          cp source/android/app/build/outputs/apk/debug/app-debug.apk "Spa-Coach-v${VERSION}-debug.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; replacing its APK."
            gh release upload "v$VERSION" "Spa-Coach-v${VERSION}-debug.apk" --clobber
          else
            gh release create "v$VERSION" "Spa-Coach-v${VERSION}-debug.apk" --title "Spa Coach v$VERSION" --notes "Automated signed Spa Coach Android release. Install over the existing app to preserve local data."
          fi

      - name: Activate OTA manifest
        shell: bash
        run: |
          cat > update.json <<EOF
          {
            "versionCode": $CODE,
            "versionName": "$VERSION",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Spa-Coach-v${VERSION}-debug.apk",
            "notes": "Automated Spa Coach Android release v${VERSION}."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "Publish Spa Coach v${VERSION} OTA update"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: Spa-Coach-v${{ env.VERSION }}
          path: Spa-Coach-v${{ env.VERSION }}-debug.apk

