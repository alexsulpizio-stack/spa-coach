name: Verify pull request

on:
  pull_request:
    paths:
      - 'source/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install browser test dependencies
        working-directory: source
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Verify version, domain logic, UI, and accessibility
        working-directory: source
        run: |
          npm run verify:version
          npm test
          npm run test:e2e

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Verify native reminder scheduling before merge
        working-directory: source/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
